# ---------------------------------------------------------------------------
# Site configuration
# Everything that changes often lives here. Edit this file, not the templates.
# ---------------------------------------------------------------------------

title: Amina Baktiyarova
tagline: Achievement Begins with Courage
description: >-
  Educational consultant helping students with IELTS prep, university
  applications, and scholarships abroad.
author: Amina Baktiyarova

url: "https://aminabaktiyarova.com"
baseurl: ""

# ---------------------------------------------------------------------------
# Contact and channels
# ---------------------------------------------------------------------------
telegram_channel: "https://t.me/aminabchannel"
telegram_direct: "https://t.me/aminabaktiyarova"
youtube: "https://youtube.com/@aminabaktiyarova?si=dR4iLEDGILcNt_YR"
email: "aminabaktiyarova.e@gmail.com"

# Booking link. Tribute page for the general admissions consultation.
booking_url: "https://web.tribute.tg/p/B1J"

# ---------------------------------------------------------------------------
# Digital product purchase links (Telegram Tribute)
# ---------------------------------------------------------------------------
tribute:
  essay_toolkit: "https://web.tribute.tg/p/Bzc"
  rec_letter_toolkit: "https://web.tribute.tg/p/Bz4"
  bundle: "https://web.tribute.tg/p/Bze"
  database_countries: "https://web.tribute.tg/p/BeT"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: /blog/:year/:slug/
timezone: Asia/Almaty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      nav: "blog"

exclude:
  - README.md
  - LAUNCH.md
  - POST-TEMPLATE.md
  - Gemfile
  - Gemfile.lock
  - vendor
