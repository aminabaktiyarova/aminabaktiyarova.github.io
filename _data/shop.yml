ielts_books:
  - name: IELTS Listening handbook
    text: A method for each of the thirteen question types, the traps, and four practice sets with explained keys.
    text_ru: Метод для каждого из тринадцати типов вопросов, ловушки и четыре тренировочных набора с объясненными ключами.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7g"
    inside:
      - Ten core skills, from using the time before each section to getting back on track after you lose your place
      - A method for each of the thirteen question types and each of the four parts of the test
      - Seven patterns that make a wrong answer sound like the right one
      - The words and number formats candidates most often get wrong
      - Four practice sets with transcripts and fully explained answer keys
    inside_ru:
      - Десять основных навыков, от использования времени перед каждой секцией до того, как продолжить, если вы сбились
      - Метод для каждого из тринадцати типов вопросов и для каждой из четырех частей теста
      - Семь приемов, из-за которых неверный ответ звучит как правильный
      - Слова и форматы чисел, в которых кандидаты ошибаются чаще всего
      - Четыре тренировочных набора с транскриптами и подробно объясненными ключами
  - name: IELTS Academic Reading handbook
    text: Skimming, scanning and close reading, a method for each question type, and three practice passages.
    text_ru: Skimming, scanning и close reading, метод для каждого типа вопросов и три тренировочных текста.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7m"
    inside:
      - Skimming, scanning, close reading, and spotting when a question has reworded the passage
      - A method for each of the thirteen question types with its traps, and worked examples for multiple choice, True, False, Not Given, and matching headings
      - The qualifying words that decide True, False and Not Given
      - Seven ways a wrong option is put together
      - Three practice passages with fully explained keys, and how to diagnose each mistake
    inside_ru:
      - Skimming, scanning, close reading и как заметить, что вопрос перефразирует текст
      - Метод для каждого из тринадцати типов вопросов с его ловушками и разобранные примеры для multiple choice, True, False, Not Given и matching headings
      - Уточняющие слова, от которых зависит выбор между True, False и Not Given
      - Семь способов, которыми строится неверный вариант ответа
      - Три тренировочных текста с подробно объясненными ключами и как найти причину каждой ошибки
  - name: IELTS Academic Writing handbook
    text: How the band is calculated, a method for Task 1 and all five Task 2 types, and annotated model answers.
    text_ru: Как считается band, метод для Task 1 и всех пяти типов Task 2 и образцы ответов с комментариями.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7o"
    inside:
      - How your band is calculated, and what an examiner does when marking
      - A complete method for Task 1 Academic and all five Task 2 question types, with annotated model answers, and an error clinic for each task
      - Paraphrasing, turning verbs into nouns, and twelve structures that signal Band 7 and above
      - Forty informal-to-formal replacements, and the forty-five most common accuracy mistakes
      - A six-step proofreading routine, and practice banks for both tasks
    inside_ru:
      - Как считается ваш band и что делает экзаменатор при проверке
      - Полный метод для Task 1 Academic и всех пяти типов вопросов Task 2 с образцами ответов и комментариями к ним, и разбор ошибок для каждого задания
      - Перефразирование, превращение глаголов в существительные и двенадцать конструкций, которые показывают уровень Band 7 и выше
      - Сорок замен неформальных выражений на формальные и сорок пять самых частых ошибок в accuracy
      - Порядок вычитки из шести шагов и сборники упражнений для обоих заданий
  - name: IELTS Speaking handbook
    text: The four criteria as an examiner hears them, model answers at Band 6, 7 and 8, and sixty task cards.
    text_ru: Четыре критерия так, как их слышит экзаменатор, образцы ответов на Band 6, 7 и 8 и шестьдесят карточек с заданиями.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7p"
    inside:
      - The four marking criteria as an examiner hears them, including what fluency means and which hesitations lose marks
      - A method for each part of the test, with annotated model answers at Band 6, 7 and 8
      - Seven ways to expand an answer so that it fills the full two minutes
      - Phrase and topic vocabulary banks, and a four-week pronunciation program
      - Sixty task cards, a Part 3 question bank and three practice tests
    inside_ru:
      - Четыре критерия оценки так, как их слышит экзаменатор, в том числе что значит fluency и какие паузы снижают оценку
      - Метод для каждой части теста с образцами ответов на Band 6, 7 и 8 и комментариями к ним
      - Семь способов развернуть ответ так, чтобы он занял все две минуты
      - Подборки фраз и тематической лексики и четырехнедельная программа по произношению
      - Шестьдесят карточек с заданиями, банк вопросов для Part 3 и три тренировочных теста
  - name: IELTS Vocabulary and Grammar handbook
    text: The grammar and vocabulary the other four handbooks assume, starting with a ten-minute diagnostic.
    text_ru: Грамматика и лексика, на которые опираются остальные четыре пособия, начиная с десятиминутной диагностики.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7s"
    inside:
      - The grammar and vocabulary the other four handbooks assume you already have
      - A ten-minute diagnostic that shows how much of the grammar review you need
      - "Band 8 structures: subordination, relative clauses, all five conditionals, participle clauses, inversion, and turning verbs into nouns"
      - Forty-one academic words, topic vocabulary for twelve subject areas, and how words combine and build from a root
      - Easily confused words, words that look familiar but mean something else, and the mistakes Russian and Kazakh speakers make most often
    inside_ru:
      - Грамматика и лексика, которые в остальных четырех пособиях считаются уже известными
      - Десятиминутная диагностика, которая показывает, какая часть повторения грамматики вам нужна
      - "Конструкции уровня Band 8: подчинение, relative clauses, все пять conditionals, participle clauses, инверсия и превращение глаголов в существительные"
      - Сорок одно академическое слово, тематическая лексика по двенадцати областям и то, как слова сочетаются и образуются от корня
      - Слова, которые легко перепутать, слова, которые выглядят знакомо, но значат другое, и ошибки, которые чаще всего делают носители русского и казахского языков
