---
layout: default
---
<div class="wrap top">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% for t in page.tags %}<a class="tag" href="{{ '/blog/' | relative_url }}#{{ t | slugify }}">{{ t }}</a>{% endfor %}
  </p>
</div>
<div class="wrap">
  <article class="prose">
    {{ content }}
  </article>
  <p class="post-end"><a class="more" href="{{ '/blog/' | relative_url }}">All posts</a></p>
</div>
