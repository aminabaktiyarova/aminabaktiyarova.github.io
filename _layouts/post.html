---
layout: default
---
<div class="wrap">
  <div class="hero">
    <div class="prose">
      <p class="eyebrow">{{ page.date | date: "%-d %B %Y" }}{% if page.tags.first %} &middot; {{ page.tags.first }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
      {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    </div>
  </div>

  <article class="post-body">
    {{ content }}
  </article>

  <hr class="rule">

  <p class="note"><a href="{{ '/abc/blog/' | relative_url }}">All posts</a> &nbsp;&middot;&nbsp; <a href="{{ '/abc/contact/' | relative_url }}">Book a consultation</a></p>
</div>
