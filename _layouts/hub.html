---
layout: default
---
<div class="wrap">
  <div class="hero">
    <div class="hero-grid">
      <div>
        {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
        <div class="actions">
          <a class="btn btn-accent" href="{{ '/abc/contact/' | relative_url }}">Book a consultation</a>
          <a class="btn" href="{{ '/abc/services/' | relative_url }}">Services</a>
        </div>
      </div>
      <div>
        {% include mark-threshold.svg class="hero-mark" %}
      </div>
    </div>
  </div>

  <hr class="rule">

  <div class="prose">
    {{ content }}
  </div>
</div>
