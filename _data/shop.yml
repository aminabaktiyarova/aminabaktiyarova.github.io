# ---------------------------------------------------------------------------
# Everything sold on the Shop page: names, prices, descriptions and links.
#
# eur: the price in euros, paid on Tribute by buyers outside Kazakhstan.
# kzt: the price in tenge, paid with Kaspi by buyers in Kazakhstan.
# tribute: the Tribute link. When it is empty, the button opens a Telegram
#   chat with Amina instead. Products use web.tribute.tg links; services use
#   t.me/tribute links, which open Tribute inside Telegram.
# ---------------------------------------------------------------------------

