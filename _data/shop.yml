ielts_books:
  - name: IELTS Listening handbook
    text: A method for each of the thirteen question types, the traps, and four practice sets with explained keys.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7g"
    inside:
      - Ten core skills, from using the time before each section to getting back on track after you lose your place
      - A method for each of the thirteen question types and each of the four parts of the test
      - Seven patterns that make a wrong answer sound like the right one
      - The words and number formats candidates most often get wrong
      - Four practice sets with transcripts and fully explained answer keys
  - name: IELTS Academic Reading handbook
    text: Skimming, scanning and close reading, a method for each question type, and three practice passages.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7m"
    inside:
      - Skimming, scanning, close reading, and spotting when a question has reworded the passage
      - A method for each of the thirteen question types with its traps, and worked examples for multiple choice, True, False, Not Given, and matching headings
      - The qualifying words that decide True, False and Not Given
      - Seven ways a wrong option is put together
      - Three practice passages with fully explained keys, and how to diagnose each mistake
  - name: IELTS Academic Writing handbook
    text: How the band is calculated, a method for Task 1 and all five Task 2 types, and annotated model answers.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7o"
    inside:
      - How your band is calculated, and what an examiner does when marking
      - A complete method for Task 1 Academic and all five Task 2 question types, with annotated model answers, and an error clinic for each task
      - Paraphrasing, turning verbs into nouns, and twelve structures that signal Band 7 and above
      - Forty informal-to-formal replacements, and the forty-five most common accuracy mistakes
      - A six-step proofreading routine, and practice banks for both tasks
  - name: IELTS Speaking handbook
    text: The four criteria as an examiner hears them, model answers at Band 6, 7 and 8, and sixty task cards.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7p"
    inside:
      - The four marking criteria as an examiner hears them, including what fluency means and which hesitations lose marks
      - A method for each part of the test, with annotated model answers at Band 6, 7 and 8
      - Seven ways to expand an answer so that it fills the full two minutes
      - Phrase and topic vocabulary banks, and a four-week pronunciation program
      - Sixty task cards, a Part 3 question bank and three practice tests
  - name: IELTS Vocabulary and Grammar handbook
    text: The grammar and vocabulary the other four handbooks assume, starting with a ten-minute diagnostic.
    eur: "15"
    kzt: "8,000"
    tribute: "https://web.tribute.tg/p/I7s"
    inside:
      - The grammar and vocabulary the other four handbooks assume you already have
      - A ten-minute diagnostic that shows how much of the grammar review you need
      - "Band 8 structures: subordination, relative clauses, all five conditionals, participle clauses, inversion, and turning verbs into nouns"
      - Forty-one academic words, topic vocabulary for twelve subject areas, and how words combine and build from a root
      - Easily confused words, words that look familiar but mean something else, and the mistakes Russian and Kazakh speakers make most often
